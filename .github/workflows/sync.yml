# Mantém o relógio e o Strava em dia sem depender de ninguém.
#
# O cron da Vercel no plano Hobby dispara uma vez ao dia. Este agendador é
# gratuito e chama /api/sync, que empurra o plano para o relógio e puxa o
# Strava (esforço relativo, tênis). Horários em UTC: Brasília é UTC−3.
#   05:45 e 05:55 BRT  → 08:45 e 08:55 UTC   (ele acorda, a noite sobe)
#   06:00–06:50 BRT a cada 10 min → 09:00–09:50 UTC
#   07:00–22:00 BRT de hora em hora → 10:00–01:00 UTC
# O GitHub pode atrasar alguns minutos na largada de cada rodada.
name: sync relógio e Strava

on:
  schedule:
    - cron: "45,55 8 * * *"
    - cron: "*/10 9 * * *"
    - cron: "0 10-23 * * *"
    - cron: "0 0-1 * * *"
  workflow_dispatch: # permite disparar na mão pela aba Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: chama /api/sync
        run: |
          resposta=$(curl -sS --max-time 90 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://ai-endurance-coach-omega.vercel.app/api/sync)
          codigo=$(echo "$resposta" | tail -1)
          echo "$resposta" | sed '$d'
          test "$codigo" = "200"
